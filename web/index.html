<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#83cdec">
  <meta name="description" content="Ngọc Rồng dành cho hội bạn. Cùng khám phá thế giới ngay trên trình duyệt.">
  <title>Ngọc Rồng · Hội Bạn</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/classic/scene.js" defer></script>
  <script src="/classic/actors.js" defer></script>
  <script src="/game.js" defer></script>
</head>
<body>
  <canvas id="world" aria-label="Bản đồ Ngọc Rồng. Di chuyển bằng WASD hoặc các nút cảm ứng."></canvas>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Ngọc Rồng"><img src="/classic/assets/logo/logo2.png" alt="Chú Bé Rồng Online"></a>
    <div class="server-state"><span id="connectionDot" class="dot"></span><span id="connectionText">Đang kết nối</span><b id="onlineCount">0/5</b></div>
    <button id="fullscreen" class="icon-button" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button>
  </header>
  <main>
    <section id="welcome" class="welcome">
      <div class="login-card">

        <div class="auth-tabs" role="tablist" aria-label="Tài khoản"><button id="loginTab" class="active" role="tab" aria-selected="true">Đăng nhập</button><button id="registerTab" role="tab" aria-selected="false">Tạo tài khoản</button></div>
        <form id="authForm">
          <label for="username">Tài khoản</label><input id="username" name="username" placeholder="Tên tài khoản của bạn" autocomplete="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}" required>
          <label for="password">Mật khẩu</label><input id="password" name="password" type="password" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password" minlength="6" maxlength="72" required>
          <div id="registerFields" hidden>
            <label for="characterName">Tên nhân vật</label><input id="characterName" placeholder="5–10 chữ cái hoặc chữ số" minlength="5" maxlength="10" pattern="[a-zA-Z0-9]{5,10}">
            <label for="gender">Hành tinh</label><select id="gender"><option value="0">Trái Đất</option><option value="1">Namek</option><option value="2">Xayda</option></select>
            <div id="inviteField" hidden><label for="invite">Mã nhóm</label><input id="invite" placeholder="Mã do chủ máy chủ chia sẻ" maxlength="128"></div>
          </div>
          <p id="authError" class="form-error" role="alert"></p>
          <button id="authSubmit" class="primary" type="submit">Đăng nhập</button>
        </form>
      </div>
    </section>
    <section id="gameUI" hidden>
      <div class="hud">
        <div class="hud-frame">
          <button id="openPanel" type="button" aria-label="Mở hành trang" title="Hành trang [I]"><span id="playerName"></span></button>
          <div class="bar hp"><span id="hpBar"></span><small id="hpText"></small></div>
          <div class="bar mp"><span id="mpBar"></span><small id="mpText"></small></div>
        </div>
        <small id="powerText"></small>
        <div id="mapName" class="map-label"></div>
      </div>
      <button id="chatToggle" type="button" class="sprite chat-toggle" aria-label="Trò chuyện" title="Chat khu vực và thế giới [Enter]" aria-controls="chat" aria-expanded="false"></button>
      <div class="auto-controls" aria-label="Điều khiển tự động">
        <button id="autoQuest" type="button" aria-pressed="false" title="Tự làm nhiệm vụ chính. Ưu tiên cộng Sức đánh, có thể cộng HP hoặc KI khi chạm giới hạn. Dùng vật phẩm và vàng theo yêu cầu nhiệm vụ.">Auto NV</button>
        <button id="autoFarm" type="button" aria-pressed="false" title="Tự đánh quái trong khu hiện tại, chờ hồi sức và tự đánh tiếp">Auto treo</button>
      </div>
      <div id="target" class="target" hidden></div>
      <div id="context" class="context" hidden></div>
      <section id="chat" class="chat" aria-label="Trò chuyện" hidden>
        <div class="panel-tabs chat-tabs" aria-label="Kênh trò chuyện">
          <button id="mapChatTab" type="button" aria-pressed="true" aria-controls="chatLog">Khu vực</button>
          <button id="worldChatTab" type="button" aria-pressed="false" aria-controls="worldChatLog">Thế giới</button>
          <button id="closeChat" type="button" aria-label="Đóng chat">×</button>
        </div>
        <div id="chatLog" class="chat-log" role="log" aria-label="Chat khu vực"></div>
        <div id="worldChatLog" class="chat-log" role="log" aria-label="Chat thế giới" hidden></div>
        <small id="worldChatRules" hidden>Cần trên 1,5 triệu sức mạnh và ít nhất 5 ngọc. Mỗi tin tốn 1 ngọc, cách nhau 30 giây.</small>
        <form id="chatForm"><input id="chatInput" placeholder="Nhắn trong khu vực…" maxlength="120" autocomplete="off" aria-label="Tin nhắn"><button aria-label="Gửi tin nhắn">↵</button></form>
      </section>
      <div id="skills" class="skills" aria-label="Kỹ năng"></div>
      <div class="touch-controls" aria-label="Điều khiển cảm ứng"><div class="dpad"><button data-dir="up" aria-label="Bay lên">▲</button><button data-dir="left" aria-label="Sang trái">◀</button><button data-dir="down" aria-label="Xuống">▼</button><button data-dir="right" aria-label="Sang phải">▶</button></div><div class="touch-actions"><button id="touchInteract" aria-label="Tương tác">E</button><button id="touchJump" aria-label="Nhảy">↥</button><button id="touchAttack" aria-label="Tấn công">ĐÁNH</button><button id="touchPea" aria-label="Ăn đậu">ĐẬU</button></div></div>
      <div id="deathActions" class="death-actions" hidden>
        <button id="returnHome" class="primary" type="button">Về nhà</button>
        <button id="revive" class="primary" type="button">Hồi sinh tại chỗ</button>
      </div>
      <aside id="panel" class="panel" aria-label="Bảng nhân vật" hidden>
        <header class="panel-heading">
          <canvas id="avatar" width="48" height="48" aria-hidden="true"></canvas>
          <div><h2 id="panelTitle"></h2><p id="panelPower"></p><p id="panelPotential"></p></div>
          <button id="closePanel" class="sprite close-button" type="button" aria-label="Đóng bảng"></button>
        </header>
        <nav id="panelTabs" class="panel-tabs main-tabs" aria-label="Danh mục">
          <button type="button" data-panel="task">Nhiệm vụ</button>
          <button type="button" data-panel="inventory">Hành trang</button>
          <button type="button" data-panel="character">Kỹ năng</button>
          <button type="button" data-panel="social">Bang hội</button>
          <button type="button" data-panel="help">Chức năng</button>
        </nav>
        <div id="panelContent"></div>
        <footer id="wallet" class="wallet"></footer>
      </aside>
      <dialog id="npcDialog" aria-labelledby="npcText">
        <div class="dialog-paper">
          <form method="dialog"><button class="sprite close-button" aria-label="Đóng hộp thoại"></button></form>
          <p id="npcText"></p>
        </div>
        <div id="npcChoices"></div>
      </dialog>
    </section>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="reconnect" class="reconnect" hidden><b>Đã ngắt kết nối</b><p id="reconnectText">Kiểm tra mạng rồi đăng nhập lại để tiếp tục.</p><button id="reconnectButton" class="primary">Kết nối lại</button></div>
  </main>
</body>
</html>
